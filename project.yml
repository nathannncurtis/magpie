name: Magpie
options:
  bundleIdPrefix: com.magpiebrowser
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"
targets:
  Magpie:
    type: application
    platform: iOS
    sources:
      - Magpie
    dependencies:
      - target: MagpieShare
      - target: MagpieWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magpiebrowser.Magpie
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    # The default-browser entitlement (com.apple.developer.web-browser) goes back here
    # once Apple grants it; a profile can't carry it before then.
    info:
      path: Magpie/Support/Info.plist
      properties:
        CFBundleDisplayName: Magpie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.magpiebrowser.Magpie.web
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - http
              - https
          - CFBundleURLName: com.magpiebrowser.Magpie.link
            CFBundleTypeRole: Viewer
            CFBundleURLSchemes:
              - magpie
        # Downloads land in Documents/Downloads, which the Files app lists and edits in place.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.magpiebrowser.Magpie.newTab
            UIApplicationShortcutItemTitle: New tab
            UIApplicationShortcutItemIconSymbolName: plus
          - UIApplicationShortcutItemType: com.magpiebrowser.Magpie.newPrivateTab
            UIApplicationShortcutItemTitle: New private tab
            UIApplicationShortcutItemIconSymbolName: eye.slash
          - UIApplicationShortcutItemType: com.magpiebrowser.Magpie.search
            UIApplicationShortcutItemTitle: Search
            UIApplicationShortcutItemIconSymbolName: magnifyingglass
        NSAppTransportSecurity:
          NSAllowsArbitraryLoadsInWebContent: true
        NSCameraUsageDescription: A page you visit can ask to use the camera, for a video call or a photo upload.
        NSMicrophoneUsageDescription: A page you visit can ask to use the microphone, for a call or a voice note.
        NSLocationWhenInUseUsageDescription: A page you visit can ask for your location, for directions or nearby results.
        NSPhotoLibraryAddUsageDescription: Lets you save an image from a page to your photos.
        NSLocalNetworkUsageDescription: Lets you open pages on your own network, like a router's settings.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UIAppFonts:
          - Fraunces[SOFT,WONK,opsz,wght].ttf
        ITSAppUsesNonExemptEncryption: false
  # Share sheet entry: hands a link to Magpie through its own URL scheme.
  MagpieShare:
    type: app-extension
    platform: iOS
    sources:
      - MagpieShare
      - Magpie/Model/MagpieLink.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magpiebrowser.Magpie.Share
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: MagpieShare/Info.plist
      properties:
        CFBundleDisplayName: Open in Magpie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
  # The search widgets: home screen small and medium, lock screen accessory.
  MagpieWidgets:
    type: app-extension
    platform: iOS
    sources:
      - MagpieWidgets
      - Magpie/UI/Components/MarkPath.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.magpiebrowser.Magpie.Widgets
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: MagpieWidgets/Info.plist
      properties:
        CFBundleDisplayName: Magpie
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  MagpieTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - MagpieTests
    dependencies:
      - target: Magpie
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  MagpieUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - MagpieUITests
    dependencies:
      - target: Magpie
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Magpie
schemes:
  Magpie:
    build:
      targets:
        Magpie: all
        MagpieTests: [test]
        MagpieUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MagpieTests
        - MagpieUITests
