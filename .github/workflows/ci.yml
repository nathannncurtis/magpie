name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.repository == 'nathannncurtis/magpie'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      app: ${{ steps.f.outputs.app }}
      board: ${{ steps.f.outputs.board }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: f
        with:
          filters: |
            app:
              - 'project.yml'
              - 'Magpie/**'
              - 'MagpieTests/**'
              - 'MagpieUITests/**'
              - 'Packages/**'
              - '.swift-format'
              - '.github/scripts/app.sh'
              - '.github/workflows/ci.yml'
            board:
              - 'docs/design/**'
              - '.github/scripts/board.sh'
              - '.github/workflows/ci.yml'

  rules:
    if: github.repository == 'nathannncurtis/magpie'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Range
        id: range
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then BASE="$HEAD~1"; fi
          echo "range=$BASE..$HEAD" >> "$GITHUB_OUTPUT"
      - name: Workflow rules
        run: bash .github/scripts/rules.sh
      - name: Secrets
        run: |
          tag=v8.30.1; v=${tag#v}
          curl -sSL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v$v/gitleaks_${v}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          mkdir gl && tar -xzf gl.tgz -C gl
          ./gl/gitleaks git --redact --no-banner --log-opts="${{ steps.range.outputs.range }}" .

  # The iPhone app: XcodeGen project, swift-format, a warnings-as-errors build and the tests on a simulator.
  app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Use Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version && swift --version
      - name: Build and test
        run: bash .github/scripts/app.sh

  # The design board is one self-contained HTML page; check it parses and loads nothing it shouldn't.
  board:
    needs: changes
    if: needs.changes.outputs.board == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the board
        run: bash .github/scripts/board.sh

  ci-ok:
    needs: [changes, rules, app, board]
    if: always() && github.repository == 'nathannncurtis/magpie'
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        run: |
          [ "${{ contains(needs.*.result, 'failure') }}" = false ] && [ "${{ contains(needs.*.result, 'cancelled') }}" = false ]
